version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      docus:
        patterns: ["docus", "nuxt", "@nuxt/*"]
      graphql-markdown:
        patterns: ["@graphql-markdown/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # docus declares a `better-sqlite3@12.x` peer dependency, so a major bump
      # breaks `npm ci` (ERESOLVE). Drop this once docus accepts the next major.
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
